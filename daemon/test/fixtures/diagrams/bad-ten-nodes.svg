  <rect x="290" y="40" width="80" height="40" rx="6" fill="var(--color-paper)" stroke="var(--color-ink)" stroke-width="1"/>
  <rect x="380" y="40" width="80" height="40" rx="6" fill="var(--color-paper)" stroke="var(--color-ink)" stroke-width="1"/>
