<style id="tokens">

  /* ===== mockup B tokens, unchanged ===== */
  :root {
    --win: #fff; --side: #f3f3f3; --list: #fafafa; --sel: #ebebeb; --hover: #f0f0f0;
    --ink: #16181a; --ink2: #4a4c50; --ink3: #6b6b6b; --quiet: #8a8a8a;
    --line: #e6e6e6; --line2: #d9d9d9;
    --honey300: #f9c846; --honey500: #f2b01e; --honey600: #e89a0c; --honey-soft: #fdf4da; --need-label: #9a6a00; --rec-text: #c98a00;
    --open: #e0352b; --ok: #18a058; --ok-soft: #e3f5ea; --pro: #0e7a43; --watch: #c2410c; --watch-soft: #ffede3;

  }

  body { font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }

  .sec { font: 600 10.5px/1 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--quiet); padding: 14px 16px 6px; display: flex; justify-content: space-between; align-items: center; }

  .pchip { display: inline-flex; gap: 4px; align-items: center; font: 400 10.5px/1 var(--mono); color: var(--ink3); margin-top: 4px; }

  .lead { font-size: 16px; line-height: 1.55; color: var(--ink); margin: 0 0 16px; }
  p { margin: 0 0 10px; }
  .body { font-size: 14.5px; line-height: 1.6; color: var(--ink2); }
  .ctx { font: 400 11.5px/1 var(--mono); color: var(--quiet); margin-bottom: 10px; text-transform: uppercase; }
  .q { font: 600 10.5px/1 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--quiet); margin: 0 0 10px; }

  .note.typed { color: var(--ink); }

  .box { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--line2); flex: none; display: grid; place-items: center; background: #fff; }
  .box.on { background: var(--honey600); border-color: var(--honey600); }

  .seg span.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .1); }
  .field { border: 1px solid var(--line2); border-radius: 10px; padding: 9px 12px; background: #fff; font-size: 13.5px; color: var(--quiet); }
  .field.typed { color: var(--ink); }
  .field.mono { font: 400 12.5px/1.4 var(--mono); }
  .code { font: 400 12px/1.5 var(--mono); color: var(--ink2); background: var(--side); border-radius: 8px; padding: 8px 11px; }
  .card { border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .crow { display: flex; align-items: center; gap: 14px; padding: 12px 16px; }
  .crow + .crow { border-top: 1px solid var(--line); }
  .crow .ct { flex: 1; min-width: 0; }
  .crow .t1 { font-weight: 600; font-size: 13.5px; line-height: 1.3; }
  .crow .t2 { color: var(--ink3); font-size: 12.5px; margin-top: 2px; line-height: 1.45; }
  .crow .tr { display: flex; align-items: center; gap: 8px; flex: none; }
  .hint { color: var(--ink3); font-size: 12.5px; line-height: 1.5; }
  .sect { display: grid; gap: 10px; }

  /* window chrome for separate windows */

  .win { background: #fff; border-radius: 12px; box-shadow: 0 0 0 1px rgb(0 0 0 / .1), 0 24px 70px rgb(0 0 0 / .16); overflow: hidden; position: relative; flex: none; }
  .lights { position: absolute; top: 14px; left: 14px; display: flex; gap: 8px; z-index: 2; }

  .pop { background: #fff; border-radius: 12px; box-shadow: 0 0 0 1px rgb(0 0 0 / .08), 0 10px 30px rgb(0 0 0 / .14); padding: 6px; }
  .mi { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 8px; font-size: 13px; }
  .mi.sel { background: var(--side); }
  .mi .ct { flex: 1; min-width: 0; }
  .mi .t1 { font-weight: 600; } .mi .t2 { color: var(--ink3); font-size: 12.5px; }
  .ck { width: 14px; flex: none; text-align: center; font-size: 12px; font-weight: 600; }
  .hr { height: 1px; background: var(--line); margin: 4px 6px; }

  /* settings window: 820 wide, sidebar 210 */
  .sw { width: 820px; display: grid; grid-template-columns: 210px 1fr; }
  .ss { background: var(--side); border-right: 1px solid var(--line); padding: 44px 0 14px; }
  .srow { display: flex; align-items: center; gap: 10px; padding: 8px 16px; font-size: 13px; font-weight: 500; color: var(--ink2); }
  .srow svg { width: 15px; height: 15px; flex: none; stroke: var(--ink3); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .srow.sel { background: #fff; box-shadow: inset 3px 0 0 var(--honey500); color: var(--ink); font-weight: 600; }
  .srow.sel svg { stroke: var(--ink); }
  .sp { padding: 30px 32px 32px; display: grid; gap: 18px; align-content: start; }
  .sp h2 { font-weight: 600; font-size: 19px; line-height: 1.25; letter-spacing: -0.02em; margin: 0; }
  .sp .sub { color: var(--ink2); font-size: 13.5px; margin: 4px 0 0; line-height: 1.5; }
</style>
</head>

="sp"><div><h2>Agents</h2><p class="sub">Waggle works with Claude Code and Codex on this Mac. Your agents ask you here instead of in the terminal.</p></div><div class="card" style="padding:4px 0"><div class="crow"><div class="ct"><div class="t1">Claude Code</div><div class="t2">Installed as Claude Code plugin</div></div><div class="tr"><span class="status ">Connected</span><button class="ghost sm">Reconnect</button></div></div><div class="crow"><div class="ct"><div class="t1">Claude app and Cowork</div><div class="t2">Added to claude_desktop_config.json. A backup is next to it.</div></div><div class="tr"><span class="status ">Connected</span><button class="ghost sm">Show file</button><button class="ghost sm">Remove</button></div></div><div class="crow"><div class="ct"><div class="t1">Codex</div><div class="t2">Trust the Waggle hooks once: type <span class="mono">/hooks</span> in Codex</div></div><div class="tr"><span class="status no">Not connected</span><button class="ghost sm">Connect</button></div></div></div><div class="hint">Waggle changes the Claude app's settings only after you press Connect and confirm.</div><div class="card"><div class="crow"><div class="ct"><div class="t1">Waggle now has a Claude Code plugin</div><div class="t2">It shows when an agent is waiting on you right above the prompt, tells Waggle what each session is doing, and makes Nudge more reliable.</div></div><div class="tr"><button class="send sm">Install plugin</button></div></div><div class="crow"><div class="ct"><div class="t1">Claude Code plugin</div><div class="t2">On adds the plugin to Claude Code. Off connects through a plain MCP entry instead.</div></div><div class="tr"><span class="hint">Working</span><span class="switch on"></span></div></div></div><div class="sect"><div class="q">Design helpers</div><div class="card"><div class="crow"><div class="ct"><div class="t1">Impeccable</div><div class="t2">Impeccable helps your agents shape, critique and polish prototypes. Free, open source (Apache 2.0).</div></div><div class="tr"><button class="ghost sm">Add to Claude Code</button></div></div></div></div><div class="sect"><div class="q">Asking in Waggle</div><div class="card"><div class="crow"><div class="ct"><div class="t1">Catch decisions in the terminal</div><div class="t2">When Claude Code ends a turn asking you to decide, it is sent back to Waggle. Needs the Waggle plugin.</div></div><div class="tr"><span class="switch on"></span></div></div><div class="crow"><div class="ct"><div class="t1">Add a Waggle rule to your agent instructions</div><div class="t2">Optional. Adds these lines to your global CLAUDE.md (Claude Code) and AGENTS.md (Codex). Nothing is written until you press Add.</div></div><div class="tr"></div></div><div class="crow"><div class="ct"><div class="t1"><span class="mono" style="font-weight:400;font-size:12.5px">✓ ~/.claude/CLAUDE.md</span></div></div><div class="tr"><button class="ghost sm">Remove</button></div></div><div class="crow"><div class="ct"><div class="t1"><span class="mono" style="font-weight:400;font-size:12.5px">○ ~/.codex/AGENTS.md</span></div><div class="t2">Codex has no stop check, so this rule is how it learns to bring decisions to Waggle.</div></div><div class="tr"><button class="ghost sm">Add</button></div></div></div></div><div class="sect"><div class="q">T3 Code</div><div class="card"><div class="crow"><div class="ct"><div class="t1">T3 Code</div><div class="t2">Connected · renews in 21 days</div></div><div class="tr"><span class="status ">Connected</span><button class="ghost sm">Renew</button><button class="ghost sm">Disconnect</button></div></div></div></div><div class="sect"><div class="q">Claude app</div><div class="card"><div class="crow"><div class="ct"><div class="t1">Claude app</div><div class="t2">Start ideas in the Claude app. Download it, then open it once.</div></div><div class="tr"><button class="ghost sm">Download ↗</button></div></div></div></div><div class="sect"><div class="q">Codex app</div><div class="card"><div class="crow"><div class="ct"><div class="t1">Codex app</div><div class="t2">Start ideas in the Codex app. Download it, then open it once.</div></div><div class="tr"><button class="ghost sm">Download ↗</button></div></div></div></div><div class="sect"><div class="q">Superset</div><div class="card"><div class="crow"><div class="ct"><div class="t1">Install Superset</div><div class="t2">Download the app and open it once. It brings the superset command with it.</div></div><div class="tr"><button class="ghost sm">Download ↗</button></div></div><div class="crow"><div class="ct"><div class="t1">Sign in</div><div class="t2">Run this line in Terminal, then add your folder as a project in Superset. <span class="mono">superset auth login</span></div></div><div class="tr"><button class="ghost sm">Copy line</button></div></div></div></div><div class="sect"><div class="q">Conductor</div><div class="card"><div class="crow"><div class="ct"><div class="t1">Conductor</div><div class="t2">Download the app. Waggle fills in your prompt and you press Enter.</div></div><div class="tr"><button class="ghost sm">Download ↗</button></div></div></div></div><div class="sect"><div class="q">Use it on your real work</div><div class="card"><div class="crow"><div class="ct"><div class="t1">Prompt for a running session</div><div class="t2">From now on, when you need a decision from me (a product, design or UX choice, a review…</div></div><div class="tr"><button class="ghost sm">Copy</button></div></div><div class="crow"><div class="ct"><div class="t1">Line for CLAUDE.md or AGENTS.md</div><div class="t2">Ask me for decisions and reviews in Waggle (waggle_ask), not in the terminal.</div></div><div class="tr"><button class="ghost sm">Copy</button></div></div></div></div><div class="sect"><div class="q">Sharing your agent setup</div><div class="card"><div class="crow"><div class="ct"><div class="t1">Invite a colleague</div><div class="t2">If your team shares Claude Code plugins or MCP config, Waggle stays off for anyone who has not installed it. Send them the install page.</div></div><div class="tr"><button class="ghost sm">Copy waggle.so/install</button></div></div></div></div><div class="sect"><div class="q">Starter prompts</div><div><span class="seg"><span class="on">Research</span><span>Product marketing</span><span>Design</span></span></div><div class="card"><div class="crow"><div class="ct"><div class="t1">Waggle a research question</div><div class="t2">Waggle this question with me: &lt;question&gt;. Ask me which angle matters, collect what you find, and send each round as a markdown review I can comment on.</div></div><div class="tr"><button class="ghost sm">Copy</button></div></div><div class="crow"><div class="ct"><div class="t1">Interview guide, then a summary</div><div class="t2">Draft an interview guide for &lt;topic&gt; and send it for review. After I run the calls, I will paste notes: send back the themes with quotes.</div></div><div class="tr"><button class="ghost sm">Copy</button></div></div></div><div class="hint">Replace the &lt;words&gt; with yours. Your agent asks you in Waggle as it goes.</div></div><div style="display:flex;gap:20px"><span class="u dark">See the exact instructions</span><span class="u">Run setup again</span></div></div></div></div>
</template>

="sp"><div><h2>Phone</h2><p class="sub">Get new decisions on your phone and answer them there. Optional, and off until you connect it.</p></div><div class="sect"><div class="q">Telegram</div><div class="hint" style="margin-top:-4px">Waggle talks to Telegram only after you connect it. Your bot token stays in the Keychain on this Mac.</div><div class="card" style="padding:14px 16px"><div style="display:grid;gap:6px;margin-bottom:12px"><div style="display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink);font-weight:400"><span class="tick" style="width:18px;height:18px">✓</span>Make a bot in Telegram</div><div style="display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink);font-weight:600"><span class="tick" style="background:var(--ink);width:18px;height:18px" style="width:18px;height:18px">2</span>Paste the bot token</div><div style="display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink3);font-weight:400"><span class="tick no" style="width:18px;height:18px">3</span>Open your bot</div></div><div style="display:flex;gap:8px;align-items:center"><span class="mono" style="font-size:11px;color:var(--quiet)">STEP 2 OF 3</span><span class="u" style="margin-left:auto;font-size:12px">Start over</span></div><div style="font-weight:600;font-size:14px;margin:6px 0 4px">Paste the bot token</div><div class="hint">The token looks like 123456789:ABC... Waggle checks it with Telegram.</div><div style="display:flex;gap:8px;margin-top:10px"><span class="field mono typed" style="flex:1">7801234567:AAF-sample-token</span><button class="send sm">Check token</button></div><div style="display:flex;gap:8px;margin-top:12px"><button class="ghost sm">Back</button><span style="margin-left:auto"></span><button class="ghost sm">Open BotFather ↗</button></div></div><div class="card"><div class="crow"><div class="ct"><div class="t1">Connected to @sample_waggle_bot</div><div class="t2">New decisions arrive in this chat. Tap a button, or reply to the message to answer in your own words.</div></div><div class="tr"><span class="status ">Connected</span><button class="ghost sm">Send a test</button><button class="ghost sm">Disconnect</button></div></div></div><div class="hint">Connected state (after step 3). "Test sent. Look at your phone." shows under it after Send a test.</div></div><div class="sect"><div class="q">Slack</div><div class="hint" style="margin-top:-4px">Waggle talks to Slack only after you connect it. Both tokens stay in the Keychain on this Mac.</div><div class="card" style="padding:14px 16px"><div style="display:grid;gap:6px;margin-bottom:12px"><div style="display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink);font-weight:400"><span class="tick" style="width:18px;height:18px">✓</span>Create the Slack app</div><div style="display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink);font-weight:400"><span class="tick" style="width:18px;height:18px">✓</span>Install it and copy the bot token</div><div style="display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink);font-weight:400"><span class="tick" style="width:18px;height:18px">✓</span>Make the app-level token</div><div style="display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink);font-weight:600"><span class="tick" style="background:var(--ink);width:18px;height:18px" style="width:18px;height:18px">4</span>Check both tokens</div><div style="display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink3);font-weight:400"><span class="tick no" style="width:18px;height:18px">5</span>Send the code to the bot</div></div><div style="display:flex;gap:8px;align-items:center"><span class="mono" style="font-size:11px;color:var(--quiet)">STEP 4 OF 5</span><span class="u" style="margin-left:auto;font-size:12px">Start over</span></div><div style="font-weight:600;font-size:14px;margin:6px 0 4px">Check both tokens</div><div class="hint">Waggle asks Slack about both tokens and opens a shor <!-- ===== Canvas chrome below: no need to edit. It stays outside the project's design system on purpose. ===== -->
<style>
  :root { color-scheme: light; }
  body.mc-canvas { margin: 0; background: #e9e9ec; color: #1d1d20; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .mc-bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; background: #f7f7f8; border-bottom: 1px solid #d4d4d8; }
  .mc-bar h1 { margin: 0; font-size: 14px; font-weight: 600; }
  .mc-bar .mc-axis { color: #5f5f66; }
  .mc-group { display: flex; gap: 2px; padding: 2px; background: #e4e4e7; border-radius: 7px; }
  .mc-group button { border: 0; background: transparent; padding: 4px 10px; border-radius: 5px; font: inherit; color: #3f3f46; cursor: pointer; min-height: 28px; }
  .mc-group button[aria-pressed="true"] { background: #fff; color: #111; box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
  .mc-group button:focus-visible { outline: 2px solid #2563eb; outline-offset: 1px; }
  .mc-board { padding: 24px; overflow-x: auto; }
  .mc-row { display: flex; gap: 32px; align-items: flex-start; width: max-content; }
  .mc-row + .mc-row { margin-top: 40px; }
  .mc-frame figcaption { margin-bottom: 8px; }
  .mc-frame figcaption strong { font-size: 14px; }
  .mc-frame figcaption span { color: #5f5f66; margin-left: 6px; }
  .mc-frame { margin: 0; }
  .mc-frame iframe { display: block; border: 0; border-radius: 12px; background: #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / 0.08), 0 8px 24px rgb(0 0 0 / 0.08); }
  .mc-notes { margin: 10px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; color: #3f3f46; max-width: 100%; }
  .mc-notes dt { color: #71717a; }
  .mc-notes dd { margin: 0; }
  /* ?export=1: one bare frame, centred, for screenshots (bash shoot.sh) */
  .mc-export .mc-bar, .mc-export figcaption, .mc-export .mc-notes { display: none; }
  .mc-export .mc-board { padding: 0; }
  .mc-export .mc-row { width: auto; justify-content: center; }
  .mc-export .mc-frame iframe { border-radius: 0; box-shadow: none; }
</style>
<script>
(() => {
  const meta = JSON.parse(document.getElementById("mockup-meta").textContent);
  const tokens = document.getElementById("tokens").outerHTML;
  const variants = [...document.querySelectorAll("template[data-variant]")];
  const params = new URLSearchParams(location.search);
  const view = { ...meta.view };
  for (const k of ["theme", "device", "v", "state", "zoom", "export"]) if (params.has(k)) view[k] = params.get(k);

  document.body.classList.add("mc-canvas");
  if (view.export) document.body.classList.add("mc-export");
  document.title = `${meta.title} · mockup`;

  const bar = document.createElement("header");
  bar.className = "mc-bar";
  bar.innerHTML = `<h1></h1><span class="mc-axis"></span>`;
  bar.querySelector("h1").textContent = meta.title;
  bar.querySelector(".mc-axis").textContent = `Axis: ${meta.axis}`;
  const board = document.createElement("div");
  board.className = "mc-board";
  document.body.append(bar, board);

  function group(label, key, values) {
    if (values.length < 2) return;
    const g = document.createElement("div");
    g.className = "mc-group";
    g.setAttribute("role", "group");
    g.setAttribute("aria-label", label);
    for (const [value, text] of values) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = text;
      b.dataset.key = key;
      b.dataset.value = value;
      b.addEventListener("click", () => { view[key] = value; sync(); });
      g.append(b);
    }
    bar.append(g);
  }
  const themes = meta.themes.map((t) => [t, t[0].toUpperCase() + t.slice(1)]);
  if (meta.themes.length > 1) themes.push(["both", "Both"]);
  group("Theme", "theme", themes);
  group("Device", "device", Object.keys(meta.devices).map((d) => [d, d[0].toUpperCase() + d.slice(1)]));
  if (!view.state && meta.states?.length) view.state = meta.states[0];
  group("State", "state", (meta.states || []).map((s) => [s, s[0].toUpperCase() + s.slice(1)]));
  group("Variants", "v", [["all", "All"], ...variants.map((t) => [t.dataset.variant, t.dataset.name])]);

  function frame(t, theme) {
    const [w, h] = meta.devices[view.device] || Object.values(meta.devices)[0];
    const fig = document.createElement("figure");
    fig.className = "mc-frame";
    fig.style.width = `${w}px`;
    const cap = document.createElement("figcaption");
    cap.innerHTML = "<strong></strong><span></span>";
    cap.querySelector("strong").textContent = t.dataset.name;
    cap.querySelector("span").textContent = [t.dataset.position, view.theme === "both" ? theme : ""].filter(Boolean).join(", ");
    const iframe = document.createElement("iframe");
    iframe.title = `${t.dataset.name}, ${theme}`;
    iframe.width = w;
    iframe.height = h;
    iframe.srcdoc = `<!doctype html><html class="${theme === "dark" ? "dark" : ""}" data-state="${view.state || ""}"><head><meta charset="utf-8"><meta name="viewport" content="width=${w}">${tokens}</head><body>${t.innerHTML}</body></html>`;
    iframe.addEventListener("load", () => {
      const doc = iframe.contentDocument;
      if (!doc) return;
      // Frames stay at device height and scroll inside, like a real screen (fixed docks stay visible).
      // "grow": true in the meta makes them as tall as the content instead (long pages, landings).
      if (!meta.grow) return;
      const fit = () => { iframe.height = Math.max(h, doc.documentElement.scrollHeight); };
      fit();
      new ResizeObserver(fit).observe(doc.body);
      doc.querySelectorAll("img").forEach((img) => img.addEventListener("load", fit));
    });
    fig.append(cap, iframe);
    if (t.dataset.rightWhen || t.dataset.costs) {
      const dl = document.createElement("dl");
      dl.className = "mc-notes";
      for (const [label, value] of [["Right when", t.dataset.rightWhen], ["Costs", t.dataset.costs]]) {
        if (!value) continue;
        const dt = document.createElement("dt"); dt.textContent = label;
        const dd = document.createElement("dd"); dd.textContent = value;
        dl.append(dt, dd);
      }
      fig.append(dl);
    }
    return fig;
  }

  function sync() {
    const url = new URL(location.href);
    for (const k of ["theme", "device", "v", "state"]) if (view[k]) url.searchParams.set(k, view[k]);
    try { history.replaceState(null, "", url); } catch {}
    bar.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(view[b.dataset.key] === b.dataset.value)));
    board.replaceChildren();
    board.style.zoom = view.zoom || 1;
    const shown = view.v === "all" ? variants : variants.filter((t) => t.dataset.variant === view.v);
    const rows = view.theme === "both" ? meta.themes : [view.theme];
    for (const theme of rows) {
      const row = document.createElement("div");
      row.className = "mc-row";
      for (const t of shown) row.append(frame(t, theme));
      board.append(row);
    }
    if (!shown.length) console.error(`mockup canvas: no variant with id "${view.v}"`);
  }

  addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea, select, [contenteditable]")) return;
    const n = Number(e.key);
    if (n >= 1 && n <= variants.length) { view.v = variants[n - 1].dataset.variant; sync(); }
    if (e.key === "0") { view.v = "all"; sync(); }
  });
  sync();
  console.log(`mockup canvas: ${variants.length} variants, theme=${view.theme}, device=${view.device}, state=${view.state || "-"}, v=${view.v}`);
})();
</script>
</body>
</html>
