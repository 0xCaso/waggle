<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup canvas</title>
<!--
  Mockup canvas: 2-3 variants side by side, each in its own frame at real size.
  Copy this file to design/mockups/<yyyy-mm-dd>-<topic>/index.html, then fill:
    1. #mockup-meta   title, axis, devices, themes, default view
    2. #tokens        the project's tokens and base styles (shared by every variant)
    3. one <template data-variant> per variant (markup, plus its own <style> if needed)
  Each frame is an iframe as wide as the device, so media queries work per frame.
  The theme is the class "dark" on the frame's <html>; write dark tokens under .dark.
  States (e.g. ["ready", "resting"]) set data-state on the frame's <html>: style them with [data-state="resting"] ...
  Fonts: put files in ./fonts/ and use relative url() in #tokens (Waggle bundles may have no network).
  URL params override the meta view: ?theme=light|dark|both &device=phone|desktop &v=<id> &state=<state> &zoom=0.5 &export=1 (bare frame)
  Frames are device height and scroll inside; position: fixed docks stay on screen. "grow": true in the meta = frame as tall as the content.
  No vh units anywhere (T3 html_preview rejects them): use height: 100% on html, body and the screen root.
-->
<script type="application/json" id="mockup-meta">
{
  "title": "Request page cleanup",
  "axis": "How much the page shows at once: light cleanup → options in place → one request in focus",
  "devices": { "desktop": [1440, 900] },
  "themes": ["light"],
  "states": [],
  "view": { "theme": "light", "device": "desktop", "v": "all", "state": "", "zoom": 1 }
}
</script>

<style id="tokens">
  @font-face { font-family: "Inter Tight"; src: url(fonts/InterTight-Regular.ttf); font-weight: 400; }
  @font-face { font-family: "Inter Tight"; src: url(fonts/InterTight-Medium.ttf); font-weight: 500; }
  @font-face { font-family: "Inter Tight"; src: url(fonts/InterTight-SemiBold.ttf); font-weight: 600; }
  @font-face { font-family: "JetBrains Mono"; src: url(fonts/JetBrainsMono-Regular.ttf); font-weight: 400; }
  :root {
    --win: #fff; --side: #f3f3f3; --list: #fafafa; --sel: #ebebeb; --hover: #f0f0f0;
    --ink: #16181a; --ink2: #4a4c50; --ink3: #6b6b6b; --quiet: #8a8a8a;
    --line: #e6e6e6; --line2: #d9d9d9;
    --honey300: #f9c846; --honey500: #f2b01e; --honey600: #e89a0c; --honey-soft: #fdf4da; --need-label: #9a6a00; --rec-text: #c98a00;
    --open: #e0352b; --ok: #18a058; --ok-soft: #e3f5ea; --pro: #0e7a43; --watch: #c2410c; --watch-soft: #ffede3;
    --sans: "Inter Tight", -apple-system, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--win); color: var(--ink); font: 400 13.5px/1.45 var(--sans); }
  body { font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  .app { display: grid; height: 100%; }
  .mono { font-family: var(--mono); }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.open { background: var(--open); } .dot.ok { background: var(--ok); }

  /* sidebar shared */
  .side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .side-head { display: flex; align-items: center; gap: 8px; padding: 40px 16px 12px; }
  .brand { display: flex; align-items: center; gap: 7px; font-weight: 500; font-size: 15px; letter-spacing: -0.03em; }
  .mark { width: 16px; height: 16px; background: var(--honey500); clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); }
  .count { background: var(--open); color: #fff; font-weight: 700; font-size: 11px; border-radius: 9px; padding: 1px 6px; }
  .sec { font: 600 10.5px/1 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--quiet); padding: 14px 16px 6px; display: flex; justify-content: space-between; }
  .sec button { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 12px; color: var(--ink3); }
  .row { display: flex; gap: 9px; padding: 9px 16px; align-items: baseline; }
  .row .dot { transform: translateY(-1px); }
  .row.sel { background: #fff; box-shadow: inset 3px 0 0 var(--honey500); }
  .row-t { font-weight: 600; font-size: 13.5px; line-height: 1.3; }
  .row-m { color: var(--quiet); font-size: 12px; margin-top: 2px; }
  .row.done .row-t { font-weight: 500; color: var(--ink2); }
  .side-foot { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--line); color: var(--ink3); font-size: 12px; display: flex; align-items: center; gap: 7px; }

  /* page shared */
  .main { display: flex; flex-direction: column; min-height: 0; }
  .top { height: 44px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--ink3); }
  .top b { color: var(--ink); font-weight: 600; }
  .status { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--pro); background: var(--ok-soft); border-radius: 20px; padding: 3px 10px; font-weight: 500; font-size: 12px; }
  .scroll { flex: 1; overflow: auto; min-height: 0; }
  .page { max-width: 760px; margin: 0 auto; padding: 28px 32px 40px; }
  h1 { font-weight: 600; font-size: 28px; line-height: 1.15; letter-spacing: -0.03em; margin: 0 0 10px; }
  .lead { font-size: 16px; line-height: 1.55; color: var(--ink); margin: 0 0 16px; }
  p { margin: 0 0 10px; }
  .body { font-size: 14.5px; line-height: 1.6; color: var(--ink2); }
  .body b { color: var(--ink); font-weight: 600; }
  table.t { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 4px 0 16px; font-size: 13.5px; background: #fff; }
  .t th { background: var(--side); text-align: left; font-weight: 600; color: var(--ink); padding: 8px 12px; }
  .t td { padding: 8px 12px; border-top: 1px solid var(--line); color: var(--ink2); vertical-align: top; }
  .t td.num, .t th.num { text-align: right; white-space: nowrap; }
  .t .muted { color: var(--quiet); }
  .src { display: inline-block; font: 400 11px/1 var(--mono); color: var(--ink3); background: var(--side); border-radius: 5px; padding: 3px 6px; margin-left: 4px; vertical-align: 1px; }
  .rec-tag { display: inline-flex; align-items: center; gap: 4px; font: 600 11px/1 var(--sans); color: var(--rec-text); background: var(--honey-soft); border-radius: 5px; padding: 4px 7px; }
  .pro { color: var(--pro); } .con { color: var(--watch); }
  .send { background: var(--ink); color: #fff; border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 13px; }
  .ghost { border: 1px solid var(--line2); border-radius: 8px; padding: 7px 12px; font-weight: 500; font-size: 13px; background: #fff; }
  .chip { border: 1px solid var(--line2); border-radius: 20px; padding: 4px 11px; font-size: 12.5px; background: #fff; color: var(--ink2); }
  .note { flex: 1; border: 1px solid var(--line2); border-radius: 10px; padding: 9px 12px; color: var(--quiet); background: #fff; font-size: 13.5px; }
</style>
</head>
<body>

<template data-variant="focus" data-name="C · Focus (stretch)" data-position="One request at a time: the queue becomes a strip, the answer card is the screen" data-right-when="You clear asks in bursts and want 'next' instead of hunting in a list of 271" data-costs="New way to move (strip + Next); history lives in its own view; the biggest change">

<!-- ===== Canvas chrome below: no need to edit. It stays outside the project's design system on purpose. ===== -->
<style>
  :root { color-scheme: light; }
  body.mc-canvas { margin: 0; background: #e9e9ec; color: #1d1d20; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .mc-bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; background: #f7f7f8; border-bottom: 1px solid #d4d4d8; }
  .mc-bar h1 { margin: 0; font-size: 14px; font-weight: 600; }
  .mc-bar .mc-axis { color: #5f5f66; }
  .mc-group { display: flex; gap: 2px; padding: 2px; background: #e4e4e7; border-radius: 7px; }
  .mc-group button { border: 0; background: transparent; padding: 4px 10px; border-radius: 5px; font: inherit; color: #3f3f46; cursor: pointer; min-height: 28px; }
  .mc-group button[aria-pressed="true"] { background: #fff; color: #111; box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
  .mc-group button:focus-visible { outline: 2px solid #2563eb; outline-offset: 1px; }
  .mc-board { padding: 24px; overflow-x: auto; }
  .mc-row { display: flex; gap: 32px; align-items: flex-start; width: max-content; }
  .mc-row + .mc-row { margin-top: 40px; }
  .mc-frame figcaption { margin-bottom: 8px; }
  .mc-frame figcaption strong { font-size: 14px; }
  .mc-frame figcaption span { color: #5f5f66; margin-left: 6px; }
  .mc-frame { margin: 0; }
  .mc-frame iframe { display: block; border: 0; border-radius: 12px; background: #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / 0.08), 0 8px 24px rgb(0 0 0 / 0.08); }
  .mc-notes { margin: 10px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; color: #3f3f46; max-width: 100%; }
  .mc-notes dt { color: #71717a; }
  .mc-notes dd { margin: 0; }
  /* ?export=1: one bare frame, centred, for screenshots (bash shoot.sh) */
  .mc-export .mc-bar, .mc-export figcaption, .mc-export .mc-notes { display: none; }
  .mc-export .mc-board { padding: 0; }
  .mc-export .mc-row { width: auto; justify-content: center; }
  .mc-export .mc-frame iframe { border-radius: 0; box-shadow: none; }
</style>
<script>
(() => {
  const meta = JSON.parse(document.getElementById("mockup-meta").textContent);
  const tokens = document.getElementById("tokens").outerHTML;
  const variants = [...document.querySelectorAll("template[data-variant]")];
  const params = new URLSearchParams(location.search);
  const view = { ...meta.view };
  for (const k of ["theme", "device", "v", "state", "zoom", "export"]) if (params.has(k)) view[k] = params.get(k);

  document.body.classList.add("mc-canvas");
  if (view.export) document.body.classList.add("mc-export");
  document.title = `${meta.title} · mockup`;

  const bar = document.createElement("header");
  bar.className = "mc-bar";
  bar.innerHTML = `<h1></h1><span class="mc-axis"></span>`;
  bar.querySelector("h1").textContent = meta.title;
  bar.querySelector(".mc-axis").textContent = `Axis: ${meta.axis}`;
  const board = document.createElement("div");
  board.className = "mc-board";
  document.body.append(bar, board);

  function group(label, key, values) {
    if (values.length < 2) return;
    const g = document.createElement("div");
    g.className = "mc-group";
    g.setAttribute("role", "group");
    g.setAttribute("aria-label", label);
    for (const [value, text] of values) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = text;
      b.dataset.key = key;
      b.dataset.value = value;
      b.addEventListener("click", () => { view[key] = value; sync(); });
      g.append(b);
    }
    bar.append(g);
  }
  const themes = meta.themes.map((t) => [t, t[0].toUpperCase() + t.slice(1)]);
  if (meta.themes.length > 1) themes.push(["both", "Both"]);
  group("Theme", "theme", themes);
  group("Device", "device", Object.keys(meta.devices).map((d) => [d, d[0].toUpperCase() + d.slice(1)]));
  if (!view.state && meta.states?.length) view.state = meta.states[0];
  group("State", "state", (meta.states || []).map((s) => [s, s[0].toUpperCase() + s.slice(1)]));
  group("Variants", "v", [["all", "All"], ...variants.map((t) => [t.dataset.variant, t.dataset.name])]);

  function frame(t, theme) {
    const [w, h] = meta.devices[view.device] || Object.values(meta.devices)[0];
    const fig = document.createElement("figure");
    fig.className = "mc-frame";
    fig.style.width = `${w}px`;
    const cap = document.createElement("figcaption");
    cap.innerHTML = "<strong></strong><span></span>";
    cap.querySelector("strong").textContent = t.dataset.name;
    cap.querySelector("span").textContent = [t.dataset.position, view.theme === "both" ? theme : ""].filter(Boolean).join(", ");
    const iframe = document.createElement("iframe");
    iframe.title = `${t.dataset.name}, ${theme}`;
    iframe.width = w;
    iframe.height = h;
    iframe.srcdoc = `<!doctype html><html class="${theme === "dark" ? "dark" : ""}" data-state="${view.state || ""}"><head><meta charset="utf-8"><meta name="viewport" content="width=${w}">${tokens}</head><body>${t.innerHTML}</body></html>`;
    iframe.addEventListener("load", () => {
      const doc = iframe.contentDocument;
      if (!doc) return;
      // Frames stay at device height and scroll inside, like a real screen (fixed docks stay visible).
      // "grow": true in the meta makes them as tall as the content instead (long pages, landings).
      if (!meta.grow) return;
      const fit = () => { iframe.height = Math.max(h, doc.documentElement.scrollHeight); };
      fit();
      new ResizeObserver(fit).observe(doc.body);
      doc.querySelectorAll("img").forEach((img) => img.addEventListener("load", fit));
    });
    fig.append(cap, iframe);
    if (t.dataset.rightWhen || t.dataset.costs) {
      const dl = document.createElement("dl");
      dl.className = "mc-notes";
      for (const [label, value] of [["Right when", t.dataset.rightWhen], ["Costs", t.dataset.costs]]) {
        if (!value) continue;
        const dt = document.createElement("dt"); dt.textContent = label;
        const dd = document.createElement("dd"); dd.textContent = value;
        dl.append(dt, dd);
      }
      fig.append(dl);
    }
    return fig;
  }

  function sync() {
    const url = new URL(location.href);
    for (const k of ["theme", "device", "v", "state"]) if (view[k]) url.searchParams.set(k, view[k]);
    try { history.replaceState(null, "", url); } catch {}
    bar.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(view[b.dataset.key] === b.dataset.value)));
    board.replaceChildren();
    board.style.zoom = view.zoom || 1;
    const shown = view.v === "all" ? variants : variants.filter((t) => t.dataset.variant === view.v);
    const rows = view.theme === "both" ? meta.themes : [view.theme];
    for (const theme of rows) {
      const row = document.createElement("div");
      row.className = "mc-row";
      for (const t of shown) row.append(frame(t, theme));
      board.append(row);
    }
    if (!shown.length) console.error(`mockup canvas: no variant with id "${view.v}"`);
  }

  addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea, select, [contenteditable]")) return;
    const n = Number(e.key);
    if (n >= 1 && n <= variants.length) { view.v = variants[n - 1].dataset.variant; sync(); }
    if (e.key === "0") { view.v = "all"; sync(); }
  });
  sync();
  console.log(`mockup canvas: ${variants.length} variants, theme=${view.theme}, device=${view.device}, state=${view.state || "-"}, v=${view.v}`);
})();
</script>
</body>
</html>
