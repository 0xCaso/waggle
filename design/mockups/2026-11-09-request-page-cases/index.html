  .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 20px; padding: 4px 10px; font: 500 12px/1 var(--sans); }
  .pill.closed { background: var(--side); color: var(--ink2); }
  .pill.closed button { font-weight: 600; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
  .pill.waiting { background: var(--honey-soft); color: var(--need-label); }

  .ver.new { color: var(--link); background: #eef2fd; border-radius: 5px; padding: 3px 6px; }

  .md h3 { font-size: 13.5px; font-weight: 600; margin: 14px 0 8px; }
  .md p { margin: 0 0 10px; font-size: 13px; color: var(--ink2); line-height: 1.55; }
  .md code { font: 400 11.5px var(--mono); background: var(--side); padding: 1px 4px; border-radius: 4px; }
  table.t { width: 100%; border-collapse: collapse; font-size: 12px; margin: 4px 0 12px; }
  .t th { background: var(--side); text-align: left; font-weight: 600; padding: 7px 10px; border: 1px solid var(--line); }

  .steps { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; font-size: 12px; }
  .steps span { width: 24px; height: 24px; border-radius: 7px; border: 1px solid var(--line2); display: grid; place-items: center; color: var(--ink3); }
  .steps span.ok { border-color: var(--ok); color: var(--ok); }
  .steps span.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .steps em { font-style: normal; color: var(--quiet); margin-left: 4px; }

  .x { padding: 0 12px 11px 38px; font-size: 12px; color: var(--ink2); }
  .x .d { margin-bottom: 6px; }
  .pc { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 14px; }

  .pc .p::before { content: "+"; color: var(--pro); } .pc .c::before { content: "–"; color: var(--watch); }
  .x .because { margin-top: 7px; color: var(--ink3); border-top: 1px dashed var(--line2); padding-top: 6px; }
  .tl { display: flex; gap: 14px; padding: 0 12px 9px 38px; font-size: 12px; color: var(--ink2); white-space: nowrap; overflow: hidden; }
  .tl span::before { font-weight: 600; margin-right: 4px; }
  .tl .p::before { content: "+"; color: var(--pro); } .tl .c::before { content: "–"; color: var(--watch); }
  .tl .n { color: var(--quiet); }
  .ch.slim { padding: 7px 12px; }
  .ans { flex: none; border-top: 1px solid var(--line); padding: 10px 14px 12px; }
  .ans .bar { display: flex; gap: 8px; align-items: center; }

  .round { text-align: center; font: 400 10.5px/1 var(--mono); color: var(--quiet); margin: 10px 0; }

<script>
(() => {
  const meta = JSON.parse(document.getElementById("mockup-meta").textContent);
  const tokens = document.getElementById("tokens").outerHTML;
  const variants = [...document.querySelectorAll("template[data-variant]")];
  const params = new URLSearchParams(location.search);
  const view = { ...meta.view };
  for (const k of ["theme", "device", "v", "state", "zoom", "export"]) if (params.has(k)) view[k] = params.get(k);

  document.body.classList.add("mc-canvas");
  if (view.export) document.body.classList.add("mc-export");
  document.title = `${meta.title} · mockup`;

  const bar = document.createElement("header");
  bar.className = "mc-bar";
  bar.innerHTML = `<h1></h1><span class="mc-axis"></span>`;
  bar.querySelector("h1").textContent = meta.title;
  bar.querySelector(".mc-axis").textContent = `Axis: ${meta.axis}`;
  const board = document.createElement("div");
  board.className = "mc-board";
  document.body.append(bar, board);

  function group(label, key, values) {
    if (values.length < 2) return;
    const g = document.createElement("div");
    g.className = "mc-group";
    g.setAttribute("role", "group");
    g.setAttribute("aria-label", label);
    for (const [value, text] of values) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = text;
      b.dataset.key = key;
      b.dataset.value = value;
      b.addEventListener("click", () => { view[key] = value; sync(); });
      g.append(b);
    }
    bar.append(g);
  }
  const themes = meta.themes.map((t) => [t, t[0].toUpperCase() + t.slice(1)]);
  if (meta.themes.length > 1) themes.push(["both", "Both"]);
  group("Theme", "theme", themes);
  group("Device", "device", Object.keys(meta.devices).map((d) => [d, d[0].toUpperCase() + d.slice(1)]));
  if (!view.state && meta.states?.length) view.state = meta.states[0];
  group("State", "state", (meta.states || []).map((s) => [s, s[0].toUpperCase() + s.slice(1)]));
  group("Variants", "v", [["all", "All"], ...variants.map((t) => [t.dataset.variant, t.dataset.name])]);

  function frame(t, theme) {
    const [w, h] = meta.devices[view.device] || Object.values(meta.devices)[0];
    const fig = document.createElement("figure");
    fig.className = "mc-frame";
    fig.style.width = `${w}px`;
    const cap = document.createElement("figcaption");
    cap.innerHTML = "<strong></strong><span></span>";
    cap.querySelector("strong").textContent = t.dataset.name;
    cap.querySelector("span").textContent = [t.dataset.position, view.theme === "both" ? theme : ""].filter(Boolean).join(", ");
    const iframe = document.createElement("iframe");
    iframe.title = `${t.dataset.name}, ${theme}`;
    iframe.width = w;
    iframe.height = h;
    iframe.srcdoc = `<!doctype html><html class="${theme === "dark" ? "dark" : ""}" data-state="${view.state || ""}"><head><meta charset="utf-8"><meta name="viewport" content="width=${w}">${tokens}</head><body>${t.innerHTML}</body></html>`;
    iframe.addEventListener("load", () => {
      const doc = iframe.contentDocument;
      if (!doc) return;
      // Frames stay at device height and scroll inside, like a real screen (fixed docks stay visible).
      // "grow": true in the meta makes them as tall as the content instead (long pages, landings).
      if (!meta.grow) return;
      const fit = () => { iframe.height = Math.max(h, doc.documentElement.scrollHeight); };
      fit();
      new ResizeObserver(fit).observe(doc.body);
      doc.querySelectorAll("img").forEach((img) => img.addEventListener("load", fit));
    });
    fig.append(cap, iframe);
    if (t.dataset.rightWhen || t.dataset.costs) {
      const dl = document.createElement("dl");
      dl.className = "mc-notes";
      for (const [label, value] of [["What changes", t.dataset.rightWhen], ["Note", t.dataset.costs]]) {
        if (!value) continue;
        const dt = document.createElement("dt"); dt.textContent = label;
        const dd = document.createElement("dd"); dd.textContent = value;
        dl.append(dt, dd);
      }
      fig.append(dl);
    }
    return fig;
  }

  function sync() {
    const url = new URL(location.href);
    for (const k of ["theme", "device", "v", "state"]) if (view[k]) url.searchParams.set(k, view[k]);
    try { history.replaceState(null, "", url); } catch {}
    bar.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(view[b.dataset.key] === b.dataset.value)));
    board.replaceChildren();
    board.style.zoom = view.zoom || 1;
    const shown = view.v === "all" ? variants : variants.filter((t) => t.dataset.variant === view.v);
    const rows = view.theme === "both" ? meta.themes : [view.theme];
    for (const theme of rows) {
      const row = document.createElement("div");
      row.className = "mc-row";
      for (const t of shown) row.append(frame(t, theme));
      board.append(row);
    }
    if (!shown.length) console.error(`mockup canvas: no variant with id "${view.v}"`);
  }

  addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea, select, [contenteditable]")) return;
    const n = Number(e.key);
    if (n >= 1 && n <= variants.length) { view.v = variants[n - 1].dataset.variant; sync(); }
    if (e.key === "0") { view.v = "all"; sync(); }
  });
  sync();
  console.log(`mockup canvas: ${variants.length} variants, theme=${view.theme}, device=${view.device}, state=${view.state || "-"}, v=${view.v}`);
})();
</script>
</body>
</html>
